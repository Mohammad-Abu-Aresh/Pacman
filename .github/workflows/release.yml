name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ENTRY: main.py     # غيّره لو الملف الرئيسي اسمه غير
  ASSETS: assets     # مجلد الصور/الأصوات (احذف السطر لو ما في)
  APP_NAME: Pacman

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            name: linux
          - os: windows-latest
            sep: ";"
            name: windows
          - os: macos-latest
            sep: ":"
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          [ -f requirements.txt ] && pip install -r requirements.txt || pip install pygame
      - name: Build
        shell: bash
        run: |
          ARGS="--onefile --windowed --name ${APP_NAME}-${{ matrix.name }}"
          [ -d "$ASSETS" ] && ARGS="$ARGS --add-data $ASSETS${{ matrix.sep }}$ASSETS"
          pyinstaller $ARGS "$ENTRY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
