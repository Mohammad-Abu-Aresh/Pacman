
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (flake8 + mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies
        run: make install

      - name: Run lint
        run: make lint

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and test dependencies
        run: |
          make install
          .venv/bin/python -m pip install pytest pytest-cov

      - name: Smoke test
        run: |
          .venv/bin/python -c \
            "import pygame; pygame.init(); print('pygame OK')"

      - name: Run tests
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest --cov --cov-report=xml
          status=$?

          if [ "$status" -eq 5 ]; then
            echo "::warning::No tests collected yet."
            exit 0
          fi

          exit "$status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
